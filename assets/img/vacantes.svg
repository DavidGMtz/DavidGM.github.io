<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Proyecto de cobertura y vacantes</title>
  <desc id="desc">Representación visual de un tablero de capital humano</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173a5e"/>
      <stop offset="1" stop-color="#79a7ce"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="85" y="115" fill="#d5eaff" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="3">CAPITAL HUMANO · INDICADORES</text>
  <text x="85" y="180" fill="#fff" font-family="Arial, sans-serif" font-size="48" font-weight="700">Cobertura y vacantes</text>
  <g transform="translate(85 235)">
    <rect width="1030" height="350" rx="18" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".2"/>
