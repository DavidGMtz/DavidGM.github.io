    <circle cx="230" cy="177" r="100" fill="none" stroke="#d8f0ff" stroke-width="38" stroke-dasharray="455 175" transform="rotate(-90 230 177)"/>
    <text x="230" y="190" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="44" font-weight="700">72%</text>
    <g fill="#fff" fill-opacity=".78">
      <rect x="455" y="82" width="430" height="28" rx="8"/>
      <rect x="455" y="140" width="330" height="28" rx="8"/>
      <rect x="455" y="198" width="380" height="28" rx="8"/>
      <rect x="455" y="256" width="245" height="28" rx="8"/>
    </g>
